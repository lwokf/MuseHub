name: Android build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musehub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish debug APK to rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
